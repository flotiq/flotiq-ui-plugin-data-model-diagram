name: Build, Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - id: version
        run: echo "version=$(jq -r '.version' dist/plugin-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          mkdir -p output
          tar -C dist -czf "output/${{ steps.version.outputs.version }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: output
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: output
      - name: Release built plugin
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: output/*
          file_glob: true
          tag: ${{ needs.build.outputs.version }}
          overwrite: true

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
